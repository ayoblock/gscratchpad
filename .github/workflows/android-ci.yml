name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  unit-lint-release:
    name: 单测 + 覆盖门禁 + Lint + Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 单元测试与 domain 覆盖门禁
        run: ./gradlew :app:testDebugUnitTest :app:coverageGate --console=plain

      - name: Lint（0 error 才继续）
        run: ./gradlew :app:lintRelease --console=plain

      - name: Release 构建（R8 + 资源收缩 + ABI splits + 包体预算）
        run: ./gradlew :app:assembleRelease :app:verifyReleaseBudget --console=plain

      - name: 采集产物与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/jacoco/jacocoDebugUnitTest/**
            android/app/build/reports/lint-results-release.*
            android/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn

  instrumented:
    name: 仪器测试（模拟器 API 36）
    needs: unit-lint-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: 仪器测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented
          path: android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
