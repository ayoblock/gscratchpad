  <circle cx="32" cy="32" r="5" fill="#ffffff" opacity="0.9"/>
  <!-- 便签横线 -->
  <g stroke="#c8c5c0" stroke-width="4" stroke-linecap="round">
    <line x1="58" y1="44" x2="102" y2="44"/>
    <line x1="58" y1="58" x2="102" y2="58"/>
    <line x1="58" y1="72" x2="94" y2="72"/>
    <line x1="58" y1="86" x2="86" y2="86"/>
  </g>
  <!-- 铅笔 -->
  <g transform="rotate(38 86 88)">
    <rect x="80" y="60" width="12" height="46" rx="2" fill="#f5c211"/>
    <rect x="80" y="60" width="12" height="8" fill="#e66100"/>
